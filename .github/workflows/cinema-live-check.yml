name: Check published cinema API
on:
  push:
    paths:
      - '.github/workflows/cinema-live-check.yml'
  workflow_dispatch:
jobs:
  test-live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify API hostname, health and frontend CORS
        shell: bash
        run: |
          set -euo pipefail
          api="https://university-cinema-api.onrender.com"
          frontend="https://university-cinema-site.onrender.com"
          echo "Checking ${api}/health"
          ok=0
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 15 "$api/health" -o /tmp/health.json; then
              if grep -q '"status":"ok"' /tmp/health.json; then ok=1; break; fi
            fi
            echo "Attempt $attempt failed; retrying."
            sleep 10
          done
          test "$ok" -eq 1 || { echo "Health did not become ready"; exit 1; }
          cat /tmp/health.json
          echo
          curl --fail --silent --show-error --location --max-time 30 "$api/api/movies" -o /tmp/movies.json
          echo "Movies response bytes: $(wc -c < /tmp/movies.json)"
          headers=$(curl --silent --show-error --location --max-time 25 -D - -o /dev/null -H "Origin: $frontend" "$api/api/movies")
          printf '%s\n' "$headers" | grep -qi "^access-control-allow-origin: $frontend" || {
            echo "Missing expected CORS Access-Control-Allow-Origin header for $frontend"
            printf '%s\n' "$headers"
            exit 1
          }
          echo "Live cinema API health, movie catalog and CORS passed"
